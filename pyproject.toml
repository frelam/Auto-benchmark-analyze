[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-diagnosis"
version = "0.1.0"
description = "One-stop LLM evaluation, benchmark low-score diagnosis, and optimization recommendation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "lvhaoyu" }]
keywords = ["llm", "evaluation", "benchmark", "diagnosis", "irt", "scaling-law"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
# Item-level multidimensional IRT (two-tower fit). Falls back to factor analysis
# when torch is absent.
mirt = ["torch>=2.0"]
# Evaluation bridge to EleutherAI lm-evaluation-harness.
eval = ["lm-eval>=0.4"]
# Weight -> OpenAI-compatible serving via vLLM (heavy; install in the GPU env).
serve = ["vllm>=0.6"]
dev = [
    "pytest>=7",
    "pytest-xdist>=3",
    "ruff>=0.4",
]

[project.scripts]
benchmark-diagnosis = "benchmark_diagnosis.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benchmark_diagnosis = [
    "recommendation/rule_base/*.yaml",
    "data/seed/*.json",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length handled by formatter; B008: typer.Option()/Argument()
# defaults are the documented CLI pattern (false positive, not a real bug).
ignore = ["E501", "B008"]
