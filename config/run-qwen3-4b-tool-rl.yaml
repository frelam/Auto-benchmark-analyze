# Run config for evaluating Qwen3-4B-tool-rl via the Auto-benchmark-analyze tool.
# Model served by SGLang at :30000 (V100 TP2, context 32768).
# Diagnosis uses the deterministic rules advisor (no analyst LLM configured).

storage:
  db_path: data/benchmark_diagnosis.db
  data_dir: data

evaluation:
  harness_cmd: /root/Auto-benchmark-analyze/.venv/bin/lm_eval   # venv copy, not the system one on PATH
  num_fewshot: null            # use each benchmark's registered default
  batch_size: auto
  limit: null                  # full evaluation (no cap)
  output_dir: data/eval_runs
  tokenizer: /root/models/Qwen3-4B-tool-rl
  max_gen_toks: 16384      # 长思考+长输出 (8192 实测被打满: humaneval 8319 tokens 截断)
  num_concurrent: 16
  max_length: 32768            # longbench_v2 needs long context; served ctx is 32768
  timeout: 7200             # 覆盖 16384 tokens 最坏生成 (~4819s @ 3.4 tok/s)
  confirm_run_unsafe_code: true  # humaneval executes generated code
  # chat/RL 模型需要 chat 模板输入：客户端渲染模板后仍走裸 completions 接口，
  # mmlu 等 log-likelihood 任务照常评测。tokenizer 已在上方配置。
  apply_chat_template: true
  # 随机采样评测：每个生成式 prompt 采样 5 次，harness 自动对分数取平均。
  # 只影响生成式任务（mmlu/mmlu_pro 等选择题是确定性打分，不受影响）；
  # 生成耗时/显存占用约放大 5 倍。
  repeats: 5
  gen_kwargs: {temperature: 0.7, top_p: 0.95}

recommendation:
  advisor_mode: rules          # deterministic experience-base engine

# 诊断默认关闭；这里显式开启（rule base 路径，确定性统计）。
diagnosis:
  enabled: true
  engine: rule

run:
  mode: full                   # evaluate + diagnose + recommend
  model:
    name: Qwen3-4B-tool-rl
    source: endpoint
    base_url: http://127.0.0.1:30000/v1
    # Portfolio (evaluable subset) + extra cross-check benchmarks:
    benchmarks:
      - aime24
      - ifeval
      - longbench_v2
      - math
      - mmlu
      - mmlu_pro
      - gsm8k
      - bbh
      - humaneval
    arch: dense
    params: 4.0
    release_date: "2026-08-18"
  output:
    dir: data/run_output
