# Default configuration for benchmark-diagnosis.
# Override any value by passing `--config path/to.yaml`; only the keys present in
# your file are overridden (deep-merged over these defaults).

storage:
  db_path: data/benchmark_diagnosis.db
  data_dir: data

# The LLM used for *analysis* (failure-mode classification, synthesis). It is a
# separate OpenAI-compatible endpoint from the model under evaluation.
llm:
  base_url: http://localhost:8000/v1
  api_key: EMPTY
  model: null          # required for diagnosis/recommendation; set to your analyst model
  max_tokens: 2048
  temperature: 0.0
  timeout_seconds: 120

evaluation:
  harness_cmd: lm_eval      # or "python -m lm_eval"
  num_fewshot: null         # null => use each benchmark's registered default
  batch_size: auto
  limit: null               # optional int: cap examples per task (debug only)
  output_dir: data/eval_runs
  # Random-sampling eval: sample each generative prompt `repeats` times and
  # let the harness average the metric over the samples (e.g. 5 runs at
  # temperature=0.7). null => single greedy pass. Only generative tasks are
  # affected (log-likelihood tasks like mmlu stay deterministic). Cost scales
  # ~N x with `repeats`. Example:
  #   repeats: 5
  #   gen_kwargs: {temperature: 0.7, top_p: 0.95}
  repeats: null
  gen_kwargs: null          # sampling kwargs, e.g. {temperature: 0.7, top_p: 0.95}
  # Endpoint evaluation knobs (used with --base-url / source=endpoint):
  tokenizer: null           # local HF tokenizer path (required by apply_chat_template)
  max_gen_toks: null        # max generation tokens for generative tasks
  num_concurrent: null      # concurrent requests against the endpoint
  max_length: null          # model context length
  timeout: null             # per-request timeout in seconds
  confirm_run_unsafe_code: false   # allow tasks that execute generated code (humaneval)
  # Chat-template evaluation: render each prompt through the tokenizer's chat
  # template client-side, then send the chat-formatted text over the raw
  # /v1/completions endpoint. Required for chat/RL-trained models that degrade
  # on bare prompts; log-likelihood tasks (mmlu etc.) keep working because the
  # wire protocol stays completions. Needs `tokenizer` above.
  apply_chat_template: false
  # Chat/RL-trained models often wrap answers so lm-eval's get-answer filter
  # drops them ([invalid]) and marks them 0, understating real capability.
  # When true, scores are re-derived from the samples_*.jsonl logs with the
  # strict reparse scorer; only [invalid]-dominated tasks are rewritten.
  reparse_scores: true
  # Native BFCL (Berkeley Function Calling Leaderboard; multi-turn tool calling)
  # evaluation. Used when --benchmarks includes the `bfcl` benchmark id; routed
  # to the official `bfcl` harness (optional dependency `pip install -e '.[bfcl]'`)
  # instead of lm-eval. Requires the endpoint to support native tool calling
  # (vLLM: --enable-auto-tool-choice --tool-call-parser; see serving.extra_args).
  bfcl_categories: null        # optional subset of BFCL categories; null => harness default
  bfcl_model_type: vllm        # vllm (matches our vLLM deploy) or openai

serving:
  engine: vllm             # vllm (sglang planned)
  host: 0.0.0.0
  port: 8000
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.9
  max_model_len: null
  extra_args: []           # extra raw CLI flags appended verbatim

# Expectation-curve judgment thresholds (section 4.2.4).
curves:
  percentile_threshold: 25      # below p25 => "under-performing"
  z_threshold: -1.0
  min_arch_points: 5            # fall back to unified curve below this many points

diagnosis:
  # Auto-diagnosis is OFF by default. Evaluation always archives its results
  # and bad cases; the diagnosis engines below only run when `enabled` is true
  # (or `run --diagnose` is passed).
  enabled: false
  # Which diagnosis path runs:
  #   rule       -> deterministic rule-base: low-score filtering (same-params /
  #                 same-active-params percentile) -> dataset-capability mapping
  #                 -> missing capabilities -> capability-dataset suggestions.
  #   llm_agent  -> rule base first, then bad-case analysis + a harness loop
  #                 (hypothesis -> eval/bad-case verification -> new hypothesis)
  #                 until a final conclusion. Requires llm_agent.* below.
  engine: rule

  # LLM-agent-base diagnosis. Only usable when ALL THREE are configured:
  # enabled: true + harness_cmd + interact_cmd.
  llm_agent:
    enabled: false
    # Command that launches the harness agent with the case pack. `{case_pack}`
    # is replaced with the case-pack directory; alternatively the directory is
    # exported as BMD_CASE_PACK. Example (deepseek harness):
    #   harness_cmd: "dsh profile run my-diagnosis-profile --case-pack {case_pack}"
    harness_cmd: null
    # Command that sends a follow-up message file to the running harness so it
    # can iterate further rounds. `{case_pack}` / `{message}` placeholders, or
    # BMD_CASE_PACK / BMD_MESSAGE env vars.
    #   interact_cmd: "dsh profile interact my-diagnosis-profile --message {message}"
    interact_cmd: null
    # Dataset-verification tool the harness calls inside its loop (the eval
    # tool). Default: this CLI's own `eval-task` subcommand.
    eval_cmd: null
    # Path to the skill directory (SKILL.md workflow) copied into the case
    # pack. null => the packaged skills/benchmark-diagnosis/ shipped with the
    # repository.
    skill_path: null
    max_rounds: 5           # cap on harness iteration rounds
    timeout_seconds: 7200   # per-round harness timeout before it is killed

  sample_size: 50              # failed cases sampled per low sub-capability
  taxonomy_path: null          # null => packaged taxonomy

  # Unified intelligent diagnosis pipeline (design doc v2, stages 1-7). Always
  # on: Stage 1 candidate generation -> Stage 2 probe verification -> Stage 3
  # guided bad-case analysis -> Stage 4 confidence fusion -> Stage 5 priority
  # scoring -> Stage 6 suggestion write-up -> Stage 7 feedback recycling. Use
  # `run --mode analyze` to skip Stage 6 suggestions; the per-stage guards below
  # decide which evidence channels fire (coarse vs fine Stage 1, pass@k tests).
  min_items_per_capability: 8  # item-level screening statistical guard
  min_peers: 5                 # minimum historical peers for percentile judgment
  min_passk_samples: 8         # minimum samples before pass@k gap is trusted
  passk_gap_threshold: 0.5     # (pass_k - pass_1)/pass_1 to call "unstable trigger"
  pass1_high_threshold: 0.5    # pass@1 below this + gap above => rejection sampling
  saturation_window: 20        # stop bad-case sampling after N new-less cases
  probe_registry_path: null    # null => packaged probe registry
  cost_table_path: null        # null => packaged Stage-5 cost table

recommendation:
  retrieval_enabled: false     # external paper/report RAG (off by default)
  max_external_sources: 5
  # Advisor used to produce optimization recommendations:
  #   auto       -> llm_rules when llm.model is configured, else rules
  #   llm_rules  -> engine Stage 2: LLM re-ranks the experience-base candidates
  #                 (grounded, needs llm.model)
  #   rules      -> deterministic experience-base engine only (ignores any
  #                 configured LLM)
  advisor_mode: auto
  max_actions: 3               # max interventions per cluster recommendation
  experience_path: null        # null => packaged experience base (YAML seed)

# Unified run profile consumed by `benchmark-diagnosis run`. The same keys can
# be passed as CLI args; CLI args take precedence over this section.
run:
  mode: full                  # benchmark (eval only, writes scores.json) | analyze (eval + diagnosis) | full (eval + diagnosis + recommendations)
  model:
    name: null                # logical model id/name (required for run)
    source: null              # weights | endpoint | scores (null => auto-detect)
    weights: null             # HF id or local path (source=weights -> auto-deploy)
    base_url: null            # OpenAI-compatible /v1 endpoint (source=endpoint)
    scores_file: null         # JSON {benchmark_id: score} (source=scores, skip eval)
    benchmarks: null          # null => full representative portfolio; or a subset like [mmlu_pro, math]
    arch: null                # dense | moe
    params: null              # parameter count in billions
    release_date: null        # ISO date
  output:
    dir: data/run_output      # report.md + metrics.json + figures/ land here
