# Default configuration for benchmark-diagnosis.
# Override any value by passing `--config path/to.yaml`; only the keys present in
# your file are overridden (deep-merged over these defaults).

storage:
  db_path: data/benchmark_diagnosis.db
  data_dir: data

# The LLM used for *analysis* (failure-mode classification, synthesis). It is a
# separate OpenAI-compatible endpoint from the model under evaluation.
llm:
  base_url: http://localhost:8000/v1
  api_key: EMPTY
  model: null          # required for diagnosis/recommendation; set to your analyst model
  max_tokens: 2048
  temperature: 0.0
  timeout_seconds: 120

evaluation:
  harness_cmd: lm_eval      # or "python -m lm_eval"
  num_fewshot: null         # null => use each benchmark's registered default
  batch_size: auto
  limit: null               # optional int: cap examples per task (debug only)
  output_dir: data/eval_runs
  tokenizer: null           # local HF tokenizer path for endpoint evals (local-completions)
  max_gen_toks: 1024        # max generation tokens for generative tasks
  num_concurrent: 16        # concurrent API requests (harness default 1 is slow)
  max_length: 2048          # max input context tokens (raise for long-context benchmarks)
  confirm_run_unsafe_code: false  # allow code-execution tasks like humaneval

serving:
  engine: vllm             # vllm (sglang planned)
  host: 0.0.0.0
  port: 8000
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.9
  max_model_len: null
  extra_args: []           # extra raw CLI flags appended verbatim

# Expectation-curve judgment thresholds (section 4.2.4).
curves:
  percentile_threshold: 25      # below p25 => "under-performing"
  z_threshold: -1.0
  min_arch_points: 5            # fall back to unified curve below this many points

diagnosis:
  sample_size: 50              # failed cases sampled per low sub-capability
  taxonomy_path: null          # null => packaged taxonomy

  # Unified intelligent diagnosis pipeline (design doc v2, stages 1-7). Always
  # on: Stage 1 candidate generation -> Stage 2 probe verification -> Stage 3
  # guided bad-case analysis -> Stage 4 confidence fusion -> Stage 5 priority
  # scoring -> Stage 6 suggestion write-up -> Stage 7 feedback recycling. Use
  # `run --mode analyze` to skip Stage 6 suggestions; the per-stage guards below
  # decide which evidence channels fire (coarse vs fine Stage 1, pass@k tests).
  min_items_per_capability: 8  # item-level screening statistical guard
  min_peers: 5                 # minimum historical peers for percentile judgment
  min_passk_samples: 8         # minimum samples before pass@k gap is trusted
  passk_gap_threshold: 0.5     # (pass_k - pass_1)/pass_1 to call "unstable trigger"
  pass1_high_threshold: 0.5    # pass@1 below this + gap above => rejection sampling
  saturation_window: 20        # stop bad-case sampling after N new-less cases
  probe_registry_path: null    # null => packaged probe registry
  cost_table_path: null        # null => packaged Stage-5 cost table

recommendation:
  retrieval_enabled: false     # external paper/report RAG (off by default)
  max_external_sources: 5
  # Advisor used to produce optimization recommendations:
  #   auto       -> llm_rules when llm.model is configured, else rules
  #   llm_rules  -> engine Stage 2: LLM re-ranks the experience-base candidates
  #                 (grounded, needs llm.model)
  #   rules      -> deterministic experience-base engine only (ignores any
  #                 configured LLM)
  advisor_mode: auto
  max_actions: 3               # max interventions per cluster recommendation
  experience_path: null        # null => packaged experience base (YAML seed)

# Unified run profile consumed by `benchmark-diagnosis run`. The same keys can
# be passed as CLI args; CLI args take precedence over this section.
run:
  mode: full                  # benchmark (eval only, writes scores.json) | analyze (eval + diagnosis) | full (eval + diagnosis + recommendations)
  model:
    name: null                # logical model id/name (auto-derived from model_path for weights)
    source: null              # weights | endpoint | scores (null => auto-detect)
    model_path: null          # HF id or local weights path (source=weights -> auto-deploy)
    base_url: null            # OpenAI-compatible /v1 endpoint (source=endpoint)
    scores_file: null         # JSON {benchmark_id: score} (source=scores, skip eval)
    benchmarks: null          # null => full representative portfolio; or a subset like [mmlu_pro, math]
    arch: null                # dense | moe
    params: null              # parameter count in billions
    release_date: null        # ISO date
  output:
    dir: data/run_output      # report.md + metrics.json + figures/ land here
